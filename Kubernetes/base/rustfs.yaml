apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-logs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec: 
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: rustfs-secrets, key: rustfs_access_key}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: rustfs-secrets, key: rustfs_secret_key}
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: error
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /var/log/rustfs/
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/rustfs
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          persistentVolumeClaim:
            claimName: rustfs-logs
        - name: secrets
          secret:
            secretName: rustfs-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001