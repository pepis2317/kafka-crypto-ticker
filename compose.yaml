services:
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./volumes:/fix_path
    command: sh -c "mkdir -p /fix_path/data /fix_path/logs && chown -R 10001:10001 /fix_path"

  rustfs:
    image: rustfs/rustfs:latest
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    volumes:
      - ./volumes/data:/data
      - ./volumes/logs:/var/log/rustfs
    environment:
      - RUSTFS_ACCESS_KEY_FILE=/run/secrets/rustfs_access_key
      - RUSTFS_SECRET_KEY_FILE=/run/secrets/rustfs_secret_key
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /opt/kafka/bin/kafka-topics.sh 
      --bootstrap-server kafka:19092 
      --create --if-not-exists 
      --topic trades --partitions 3 --replication-factor 1
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://:9092,DOCKER://:19092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
        interval: 5s
        timeout: 10s
        retries: 10
  crypto-ticker.alertservice:
    image: crypto-ticker.alertservice
    build:
      context: .
      dockerfile: src/crypto-ticker.AlertService/Dockerfile

  crypto-ticker.archiver:
    image: crypto-ticker.archiver
    build:
      context: .
      dockerfile: src/crypto-ticker.Archiver/Dockerfile

  crypto-ticker.candleservice:
    image: crypto-ticker.candleservice
    build:
      context: .
      dockerfile: src/crypto-ticker.CandleService/Dockerfile

  crypto-ticker.ingester:
    image: crypto-ticker.ingester
    build:
      context: .
      dockerfile: src/crypto-ticker.Ingester/Dockerfile

  crypto-ticker.priceservice:
    image: crypto-ticker.priceservice
    build:
      context: .
      dockerfile: src/crypto-ticker.PriceService/Dockerfile
secrets:
  rustfs_access_key:
    file: ./secrets/rustfs_access_key
  rustfs_secret_key:
    file: ./secrets/rustfs_secret_key